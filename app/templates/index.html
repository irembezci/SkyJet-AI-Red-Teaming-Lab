<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyJet AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div id="login-page" class="page">
    <div class="card">
        <div class="logo">✈ SkyJet AI</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your SkyJet account</p>

        <form id="login-form">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="alice"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Sign in</button>

            <p id="login-error" class="error"></p>
        </form>
    </div>
</div>


<div id="chat-page" class="chat-page hidden">

    <header class="chat-header">
        <div>
            <div class="logo">✈ SkyJet AI</div>
            <span id="user-name"></span>
        </div>

        <button id="logout-button" class="logout-button">
            Logout
        </button>
    </header>

    <main id="chat-messages" class="chat-messages">
        <div class="message assistant">
            <div class="bubble">
                Hello! I'm SkyJet AI. How can I help you today?
            </div>
        </div>
    </main>

    <form id="chat-form" class="chat-input">
        <input
            type="text"
            id="message-input"
            placeholder="Ask SkyJet AI..."
            autocomplete="off"
            required
        >

        <button type="submit">➤</button>
    </form>

</div>

<script src="/static/app.js"></script>

</body>
</html>
